#  Example QuDi configuration file.
#
#
#
# IMPORTANT: The format of every 'module.Class' line has changed on 28.6.2015.
# =========  The class name now needs to be explicitly given here in the config.
#		  the config line must the form package.module.Class.ClassName
global:
    # list of modules to load when starting
    startup: ['man', 'tray', 'tasklogic']

    # Devices are defined in another config file:
    #hardware: readConfigFile('devices.cfg')
    remoteport: 12345

    ## For controlling the appearance of the GUI:
    stylesheet: 'qdark.qss'

hardware:
    mw_source_srssg:
        module.Class: 'microwave.mw_source_srssg_copy.MicrowaveSRSSG'
        awg_ip_address: '10.107.54.148'
        awg_port: 5025 # the port number as integer

    simpledummy:
        module.Class: 'simple_data_dummy.SimpleDummy'

    microwave:
        module.Class: 'microwave.mw_source_smiq.MicrowaveSmiq'
        gpib_address: 'GPIB0::28::INSTR'
        gpib_timeout: 20
        mock: True

    mydummyodmrcounter:
        module.Class: 'odmr_counter_dummy.ODMRCounterDummy'
        clock_frequency: 100
        connect:
            fitlogic: 'fitlogic.fitlogic'

    # below here is my hardware

    nicard:
        module.Class: 'national_instruments_x_series.NationalInstrumentsXSeries'
        clock_channel: '/Dev1/Ctr0'
        counter_channels:
            - '/Dev1/Ctr3'
        scanner_clock_channel: '/Dev1/Ctr2'
        scanner_counter_channels:
            - '/Dev1/Ctr1'
        photon_sources:
            - '/Dev1/PFI3'
        scanner_ao_channels:
            - '/Dev1/AO0'
            - '/Dev1/AO1'
            - '/Dev1/AO2'
            - '/Dev1/AO3'
        scanner_position_ranges:
            - [0.1e-6, 200e-6]
            - [0.1e-6, 200e-6]
            - [0.1e-6, 200e-6]
            - [-10, 10]
        scanner_voltage_ranges:
            - [0.001, 10]
            - [0.001, 10]
            - [0.001, 10]
            - [0, 10]
        default_samples_number: 10
        default_clock_frequency: 100
        default_scanner_clock_frequency: 100
        gate_in_channel: '/Dev1/PFI0'
        counting_edge_rising: True
        odmr_trigger_channel: '/Dev1/PFI15'    

    myawg:
        module.Class: 'awg.tektronix_awg70k.AWG70K'
        awg_IP_address: '169.254.226.163'
        awg_port: 4001
        default_sample_rate: 8e9  # in Samples/seconds
        pulsed_file_dir: 'C:/Software/pulsed_files'
        awg_ftp_path: 'C:/InetPub/ftproot' # this path cannot be retrieved otherwise.

    fastcounter:
        ##### dummy counter
        #module.Class: 'fast_counter_dummy.FastCounterDummy'
        ##### pi3 counter
        #module.Class: 'fpga_fastcounter.fast_counter_fpga_pi3.FastCounterFGAPiP3'
        #fpgacounter_serial: '13120005IJ'
        #fpgacounter_channel_apd_0: 1
        #fpgacounter_channel_apd_1: 3
        #fpgacounter_channel_detect: 2
        #fpgacounter_channel_sequence: 6
        ##### qo counter
        module.Class: 'fpga_fastcounter.fast_counter_fpga_qo.FastCounterFGAPQO'
        fpgacounter_serial: '14230007BM'
        fpga_type: 'XEM6310_LX150'


        #here are the newly added hardwares to test pulseblaster compatibility

    pulseblaster:
            module.Class: 'spincore.pulse_blaster_esrpro.PulseBlasterESRPRO'
            clock_frequency: 500e6 # in Hz
            min_instr_len: 5    # number of clock cycles for minimal instruction
            debug_mode: False   # optional, to set the debug mode on or off.
            use_smart_pulse_creation: False # optinal, default is false, try to
                                            # optimize the memory used on the device.
            #library_file: 'spinapi64.dll'  # optional, name of the library file
                                            # or  whole path to the file

logic:
    kernellogic:
        module.Class: 'notebook.NotebookLogic'

    sequencegenerator:
        module.Class: 'sequence_generator_logic.SequenceGeneratorLogic'
        connect:
            pulser: 'myawg.pulser'
        prepared_methods: ['generate_laser_on','generate_rabi','generate_pulsedodmr','generate_xy8']

    pulseextraction:
        module.Class: 'pulse_extraction_logic.PulseExtractionLogic'
        connect:
            fastcounter: 'fastcounter.fastcounter'

    pulseanalysis:
        module.Class: 'pulse_analysis_logic.PulseAnalysisLogic'
        connect:
            pulseextractionlogic: 'pulseextraction.pulseextractionlogic'
            fitlogic: 'fit.fitlogic'

    pulsedmeasurement:
        module.Class: 'pulsed_measurement_logic.PulsedMeasurementLogic'
        connect:
            fastcounter: 'fastcounter.fastcounter'
            pulseanalysislogic: 'pulseanalysis.pulseanalysislogic'
            pulsegenerator: 'myawg.pulser'
            scannerlogic: 'scanner.scannerlogic'
            fitlogic: 'fit.fitlogic'
            microwave: 'microwave.mwsourcesmiq'
            savelogic: 'save.savelogic'
            optimizer1: 'optimizer.optimizerlogic'

    counterlogic:
        module.Class: 'counter_logic.CounterLogic'
        connect:
            counter1: 'nicard'
            savelogic: 'savelogic'

    scannerlogic:
        module.Class: 'confocal_logic.ConfocalLogic'
        connect:
            confocalscanner1: 'nicard'
            savelogic: 'savelogic'

    optimizerlogic:
        module.Class: 'optimizer_logic.OptimizerLogic'
        connect:
            confocalscanner1: 'nicard'
            fitlogic: 'fitlogic'

    poimanager:
        module.Class: 'poi_manager_logic.PoiManagerLogic'
        connect:
            scannerlogic: 'scannerlogic'
            optimiserlogic: 'optimizerlogic'
            savelogic: 'savelogic'

    odmrlogic:
        module.Class: 'odmr_logic.ODMRLogic'
        connect:
            odmrcounter: 'nicard'
            fitlogic: 'fitlogic'
            microwave1: 'mw_source_agilent'
            savelogic: 'savelogic'
            taskrunner: 'tasklogic'

    odmr_counter_microwave_interfuse:
        module.Class: 'interfuse.odmr_counter_microwave_interfuse.ODMRCounterMicrowaveInterfuse'
        connect:
            slowcounter: 'nicard'
            microwave: 'mw_source_srssg'

    # this oder logic runs now with the interfuse
    odmrlogic2:
        module.Class: 'odmr_logic.ODMRLogic'
        connect:
            odmrcounter: 'odmr_counter_microwave_interfuse'
            fitlogic: 'fitlogic'
            microwave1: 'odmr_counter_microwave_interfuse'
            savelogic: 'savelogic'
            taskrunner: 'tasklogic'
        scanmode: 'LIST'

    fitlogic:
        module.Class: 'fit_logic.FitLogic'

    tasklogic:
        module.Class: 'taskrunner.TaskRunner'
        tasks:
        #    dummytask:
        #        module: 'dummy'
        #        preposttasks: ['ppdummy']
        #    dummyinterruptor:
        #        module: 'dummy'
        #        pausetasks: ['dummytask']
        #        preposttasks: ['ppdummy2']
        #    ppdummy:
        #        module: 'prepostdummy'
        #    ppdummy2:
        #        module: 'prepostdummy'
            scannerLocationRefocus:
                module: 'refocus'
        #        preposttasks: ['fliplasermirror']
                pausetasks: ['scan', 'odmr']
                needsmodules:
                    optimizer: 'optimizerlogic'
        #        config:
        #            initial: [1, 1, 1]
        #    fliplasermirror:
        #        module: 'flipmirror'
        #        needsmodules:
        #            switchlogic: 'switch'
        #        config:
        #            sequence: [('mydummyswitch1', 1, True), ('mydummyswitch1', 2, True), ('mydummyswitch2', 1, True)]

    savelogic:
        module.Class: 'save_logic.SaveLogic'
        win_data_directory: 'C:/Data'   # DO NOT CHANGE THE DIRECTORY HERE! ONLY IN THE CUSTOM FILE!
        unix_data_directory: 'Data/'
        log_into_daily_directory: True
        save_pdf: True
        save_png: True

gui:
    tray:
        module.Class: 'trayicon.TrayIcon'
    man:
        module.Class: 'manager.managergui.ManagerGui'

    counter:
        module.Class: 'counter.countergui.CounterGui'
        connect:
            counterlogic1: 'counterlogic'

    confocalgui:
        module.Class: 'confocal.confocalgui.ConfocalGui'
        connect:
            confocallogic1: 'scannerlogic'
            savelogic: 'savelogic'
            optimizerlogic1: 'optimizerlogic'
        fixed_aspect_ratio_xy: True
        fixed_aspect_ratio_depth: True
        slider_stepsize: 0.001  # in micrometer
        image_x_padding: 0.02
        image_y_padding: 0.02
        image_z_padding: 0.02

    poimanagergui:
        module.Class: 'poimanager.poimangui.PoiManagerGui'
        connect:
            poimanagerlogic: 'poimanager'
            scannerlogic: 'scannerlogic'

    odmr:
        module.Class: 'odmr.odmrgui.ODMRGui'
        connect:
            odmrlogic1: 'odmrlogic'
            savelogic: 'savelogic'
        fixed_aspect_ratio_xy: True
        fixed_aspect_ratio_depth: True
        slider_stepsize: 0.001  # in micrometer
        image_x_padding: 0.02
        image_y_padding: 0.02
        image_z_padding: 0.02

    taskgui:
        module.Class: 'taskrunner.taskgui.TaskGui'
        connect:
            tasklogic: 'tasklogic.runner'
    pulsedmeasurementgui:
        module.Class: 'pulsed.pulsed_maingui.PulsedMeasurementGui'
        connect:
            pulsedmeasurementlogic: 'pulsedmeasurement.pulsedmeasurementlogic'
            sequencegeneratorlogic: 'sequencegenerator.sequencegenerator'
            pulseanalysislogic: 'pulseanalysis.pulseanalysislogic'
            savelogic: 'save.savelogic'

    # Gui to test the dummy counting
    odmrgui_program_trigger:
        module.Class: 'odmr.odmrgui.ODMRGui'
        connect:
            odmrlogic1: 'odmrlogic2'
            savelogic: 'savelogic'
